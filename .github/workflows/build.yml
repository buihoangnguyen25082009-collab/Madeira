name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          brew install cmake ninja lld

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Disable dylib signing script
        run: |
          python3 -c '
          import re, glob

          for pbx in glob.glob("**/*.pbxproj", recursive=True):
              with open(pbx, "r", encoding="utf-8") as f:
                  content = f.read()

              def patch_block(match):
                  block = match.group(0)
                  if "Sign bundled dylibs" in block:
                      print(f"Patched Sign bundled dylibs in {pbx}")
                      block = re.sub(r"shellScript = \"[\s\S]*?\";", "shellScript = \"exit 0\\n\";", block)
                  return block

              new_content = re.sub(r"\{[^{}]*isa = PBXShellScriptBuildPhase;[^{}]*\}", patch_block, content)
              with open(pbx, "w", encoding="utf-8") as f:
                  f.write(new_content)
          '

      - name: Build Project
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -project "$PROJ_FILE" -list | sed -n '/Schemes:/,$p' | sed '1d' | head -n 1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="Madeira"
          fi
          echo "Building scheme: $SCHEME"
          
          xcodebuild -project "$PROJ_FILE" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build_output \
            clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            cp -R "$APP_DIR" Payload/
            zip -r Madeira.ipa Payload
          else
            echo "Error: .app file not found"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Release-IPA
          path: Madeira.ipa
          retention-days: 7
