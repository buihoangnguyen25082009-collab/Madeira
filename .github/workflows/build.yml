name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout code with submodules & LFS
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Install build tools
        run: |
          brew install cmake ninja lld

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Strip Signing Build Phases
        run: |
          python3 -c '
          import glob, re

          for pbx in glob.glob("**/*.pbxproj", recursive=True):
              with open(pbx, "r", encoding="utf-8") as f:
                  content = f.read()

              # Vo hieu hoa moi script phase chua tu khoa codesign hoac Sign bundled dylibs
              def neutralize_script(match):
                  body = match.group(0)
                  if "Sign bundled dylibs" in body or "codesign" in body:
                      print(f"Neutralized phase in {pbx}")
                      body = re.sub(r"shellScript\s*=\s*\"[\s\S]*?\";", "shellScript = \"exit 0\\n\";", body)
                  return body

              content = re.sub(r"[0-9A-Fa-f]{24}\s*/\*[^*]*\*/\s*=\s*\{[\s\S]*?isa\s*=\s*PBXShellScriptBuildPhase;[\s\S]*?\};", neutralize_script, content)
              
              # Thay the truc tiep moi lenh codesign con sot lai thanh /usr/bin/true
              content = content.replace("/usr/bin/codesign", "/usr/bin/true")
              content = re.sub(r"\bcodesign\b", "/usr/bin/true", content)

              with open(pbx, "w", encoding="utf-8") as f:
                  f.write(content)
          '

      - name: Build Project
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -project "$PROJ_FILE" -list | sed -n '/Schemes:/,$p' | sed '1d' | head -n 1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="Madeira"
          fi
          echo "Building scheme: $SCHEME"
          
          # Chay xcodebuild va ghi log de bat loi neu build that bai
          set -o pipefail
          xcodebuild -project "$PROJ_FILE" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build_output \
            build 2>&1 | tee xcodebuild.log || {
              echo "==================== XCODE ERROR DETAILS ===================="
              grep -E -i -C 2 "error:|fatal error:|PhaseScriptExecution.*failed" xcodebuild.log | tail -n 40
              echo "============================================================="
              exit 1
            }

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            cp -R "$APP_DIR" Payload/
            zip -r Madeira.ipa Payload
          else
            echo "Error: .app file not found"
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Release-IPA
          path: Madeira.ipa
          retention-days: 7
